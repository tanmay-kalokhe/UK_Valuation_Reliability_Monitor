# Checks that run automatically before every commit.
# Install once:  .venv\Scripts\pre-commit install
repos:
  - repo: local
    hooks:
      - id: forbid-data-files
        name: Block data, database and .pbix files (licence terms)
        entry: Data files must not be committed. Keep them in data/ or dashboards/power_bi/data/.
        language: fail
        files: '\.(csv|parquet|pbix|duckdb|zip|xlsx)$'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.4.0
    hooks:
      - id: sqlfluff-lint
