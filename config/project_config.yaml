# Central settings for the UK Valuation Reliability Monitor.
# Values marked PROVISIONAL are confirmed during the build and recorded in docs/decision_log.md.

project:
  name: UK Valuation Reliability Monitor
  package: valuation_monitor

paths:
  raw_price_paid: data/raw/price_paid
  raw_epc: data/raw/epc
  raw_house_price_index: data/raw/house_price_index
  raw_geography: data/raw/geography
  interim: data/interim
  processed: data/processed
  database: data/processed/valuation.duckdb
  figures: reports/figures

sources:
  # Downloaded by: python -m valuation_monitor.download  (EPC is manual; see data/README.md)
  price_paid:
    # HM Land Registry's official download host (HTTP only). 2020 is included for prior-year baseline features.
    base_url: http://prod1.publicdata.landregistry.gov.uk.s3-website-eu-west-1.amazonaws.com
    years: [2020, 2021, 2022, 2023, 2024, 2025, 2026]
    monthly_update_file: pp-monthly-update-new-version.csv
  house_price_index:
    # Latest edition at setup (published Sep 2026, covers to Jul 2026). Update the month when refreshing.
    url: https://publicdata.landregistry.gov.uk/market-trend-data/house-price-index-data/UK-HPI-full-file-2026-07.csv
    filename: UK-HPI-full-file-2026-07.csv
  postcode_lookup:
    # ONS: Postcode to OA (2021) to LSOA to MSOA to LAD with Classifications (August 2026) Best Fit Lookup in the UK
    url: https://www.arcgis.com/sharing/rest/content/items/bb61aafc3f0346e79f621c32fb2559d5/data
    filename: NSPCL_AUG26_UK_LU.zip
  boundaries:
    local_authority:
      # ONS Local Authority Districts (May 2026) Boundaries UK BGC
      url: https://services1.arcgis.com/ESMARspQHYMw9BZ9/arcgis/rest/services/Local_Authority_Districts_May_2026_Boundaries_UK_BGC/FeatureServer/0
      filename: lad_may2026_uk_bgc.geojson
    msoa:
      # ONS Middle layer Super Output Areas (December 2021) Boundaries EW BGC (V3)
      url: https://services1.arcgis.com/ESMARspQHYMw9BZ9/arcgis/rest/services/Middle_layer_Super_Output_Areas_December_2021_Boundaries_EW_BGC_V3/FeatureServer/0
      filename: msoa_dec2021_ew_bgc.geojson

study_area:
  # A contrasting mix of markets (decision D-008). Codes verified against ONS
  # Local Authority Districts (May 2026) on 2026-10-14.
  local_authorities:
    - { code: E08000003, name: Manchester, market: city centre and inner city }
    - { code: E08000009, name: Trafford, market: affluent suburb }
    - { code: E08000035, name: Leeds, market: large mixed city }
    - { code: E06000042, name: Milton Keynes, market: commuter new town, many new builds }
    - { code: E09000007, name: Camden, market: high-value London, mostly flats }
    - { code: E06000052, name: Cornwall, market: rural and coastal, second homes }
    - { code: W06000015, name: Cardiff, market: Welsh capital }
  start_date: "2021-01-01"
  end_date: null  # null means the latest available release

price_paid:
  # Category A = standard price paid. Category B (repossessions, identifiable buy-to-lets,
  # transfers to non-private individuals) is excluded.
  keep_categories: ["A"]

epc:
  # Use the most recent certificate lodged on or before the sale date, to avoid leaking post-sale information.
  match_rule: latest_before_sale

modelling:
  target: log_price
  baseline: district_median_indexed_by_hpi
  candidates: [lightgbm, catboost]
  random_seed: 42

intervals:
  method: conformalised_quantile_regression  # alternatives: split_conformal, mondrian_conformal
  target_coverage: 0.90

validation:
  time_split: rolling_origin_monthly
  geographic_holdout_unit: local_authority

matching:
  primary: sql_rules            # deterministic SQL address matching
  comparison: splink            # probabilistic matching (Splink on DuckDB), compared on a hand-checked sample
  hand_checked_sample_size: 300

maps:
  # Open ONS boundaries. Postcode-district boundaries are not available as open data.
  alert_map_level: local_authority   # monthly alerts need enough sales per area
  error_map_level: msoa              # error and coverage pooled over the whole test period

demo:
  hosting: streamlit_community_cloud
  inputs: property characteristics and postcode district only (no address selection)

decision_rule:
  # Accept the automated valuation when stressed LTV = (LTV x estimate) / range_lower <= stress_cap
  # (decision D-013). Illustrative design choices, not any lender's policy.
  default_ltv: 0.75
  ltv_options: [0.50, 0.60, 0.75, 0.85, 0.90, 0.95]
  stress_cap: 1.00

monitoring:
  min_sales_per_area_month: 30   # PROVISIONAL
  coverage_alert_below: 0.85     # PROVISIONAL
  error_increase_alert: 0.20     # PROVISIONAL: relative rise in median absolute percentage error
